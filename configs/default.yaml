# Stage 1 全局默认配置
# 优先级: CLI 参数 > 环境变量 > 本文件 > 代码默认值

# LLM 配置（OpenAI 兼容接口，可通过 base_url 切换服务商）
llm:
  api_key: null                    # 优先从环境变量 LLM_API_KEY 读取
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  temperature: 0                   # 规则归纳需要稳定输出
  max_tokens: 4096                 # 输出上限，防高基数自由文本列 JSON 被截断（0=不显式传）
  max_retries: 1                   # JSON 解析/接口调用失败时的额外重试次数

# 数据画像参数
profiling:
  max_samples: 20                  # 每列最多保留的样例值数量

# 规则执行参数
execution:
  max_violation_rate: 0.3          # 误报控制：违反率超过 30% 的规则会被丢弃
  nullable_columns: []             # 显式跳过 MV 扫描的列名列表
  infer_nullable: false            # 根据 LLM 无 not_null + 高空值率推断可空列（默认关闭）
  infer_nullable_min_rate: 0.5     # infer_nullable 生效时的空值率下限
  enable_type_check: true          # 列逻辑类型一致性校验（bool/int/float/date，借鉴 Cocoon）
  guard:
    enabled: true
    top5_coverage_structured_min: 0.5
    distinct_pattern_structured_max: 30
    dominant_pattern_rate_min: 0.7
  # 伪缺失值检测（DMV）：识别非空但语义为缺失的占位值（?/unknown/missing/...）
  dmv:
    enabled: true
    extra_tokens: []               # 默认词表外追加的伪缺失 token
    detect_numeric_placeholder: false  # 是否检测占位数字（9999/-1 等，默认关闭控误报）
    numeric_placeholders: []       # 自定义占位数字（留空用内置默认集）
  # 不一致表示/标准化检测（借鉴 Cocoon String Outliers）：捕获多数派单位/格式不一致
  standardize:
    enabled: true
    sample_n: 50                   # 发给 LLM 的每列 top-N 高频 distinct 值
    max_distinct_ratio: 0.6        # distinct/非空 超过此值视为自由文本/标识列，跳过
    max_flag_rate: 0.95            # 命中率上限闸门（防 LLM 误选规范形态导致爆量误报）
  # 引用/元数据泄漏检测：识别 RIS/MEDLINE/PubMed 标签混入字段值（常见于文献类脏数据）
  leakage:
    enabled: true
    skip_numeric: true             # 跳过数值列（不可能是文献元数据泄漏）
    numeric_min_ratio: 0.8         # 判定数值列的可解析比例
    min_len_ratio: 3.0             # 长度离群门控：仅标记长度 > 列中位长度*该比值的格（0=关闭）
  # 重复值检测：整值由同一内容重复拼接（如 'X,X'），常见于列表型字段被冗余复制
  dup:
    enabled: true
    sep: ","                       # token 分隔符（列表型字段常用逗号）
  # 跨列"全名↔标准缩写"一致性检测：发现并修复两列对调（如期刊全名/缩写互换）
  xcol:
    enabled: true
    min_rows: 30                   # 列对两列都非空的最小行数
    min_len_ratio: 1.4             # full 列中位长度 / abbrev 列中位长度 的下限
    min_multi_token_rate: 0.5      # abbrev 列多 token 行占比下限（排除单码列）
    min_abbrev_rate: 0.55          # 多数行 abbrev 为 full 严格缩写的占比下限（宽松发现）
    semantic_check: true           # 用 LLM 确认列对确为"全名↔缩写"关系（过滤伪对）
  # 极端统计兜底（高精度）：数值/日期列 Robust-Z(>6) + IQR(k=4.5) 双判据，只捞确凿极端值；
  # 温和离群交由 Stage 2 统计/近邻等多检测器 + 证据融合处理。
  statistic_extreme:
    enabled: true
    robust_z: 6.0                  # Robust-Z 阈值（远高于 Stage 2 的 3.0）
    iqr_k: 4.5                     # IQR 系数（越大越保守）
    detect_dates: true            # 对可解析日期列检测过早/未来等离群日期
  # 注：Typo / 主导格式(format_outlier) / 近似函数依赖(FD) 已迁移至 Stage 2 多检测器层。

# 目录布局：data/ 仅原始数据；生成物写入 output/ 子目录
layout:
  data_dir: data
  output_root: output
  mask_dir: output/mask
  stage1_dir: output/stage1
  stage2_dir: output/stage2
  stage3_dir: output/stage3
  cache_dir: cache

# 输入输出路径（默认由 --input 自动推导；此处仅覆盖缓存等全局项）
paths:
  rule_cache: cache/rule_cache.json
